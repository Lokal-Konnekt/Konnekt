# Render blueprint for Konnekt Listen Together (Go backend).
# Parties live in memory, so run exactly one instance. Deploys are manual so
# forks deployed with the public one-click button do not redeploy on upstream pushes.

services:
  - type: web
    name: konnekt-listen-together
    runtime: go
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: go build -o server .
    startCommand: ./server
    healthCheckPath: /healthz
    numInstances: 1
    autoDeployTrigger: off
    envVars:
      - key: JAM_MAX_MEMBERS
        value: "5"
      - key: JAM_STATE_HEARTBEAT_MS
        value: "5000"
      - key: JAM_MAX_UPCOMING_QUEUE
        value: "25"
      - key: JAM_MAX_PARTIES
        value: "50"
      - key: JAM_CREATE_RATE_PER_MINUTE
        value: "2"
      - key: JAM_CONNECTION_IDLE_MS
        value: "900000"
      # Render terminates TLS and supplies the real client IP in X-Forwarded-For.
      - key: JAM_TRUST_PROXY
        value: "true"
