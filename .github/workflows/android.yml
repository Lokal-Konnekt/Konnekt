name: Android Release APK

on:
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > konnekt-release.jks
        {
          echo "storeFile=konnekt-release.jks"
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Verify package, signature and alignment
      shell: bash
      run: |
        set -euo pipefail
        tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
        expected_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
        expected_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
        shopt -s nullglob
        apks=(app/build/outputs/apk/prod/release/*.apk)
        test "${#apks[@]}" -gt 0
        for apk in "${apks[@]}"; do
          package_line="$("$tools_dir/aapt" dump badging "$apk" | sed -n '1p')"
          [[ "$package_line" == *"name='com.music.konnekt'"* ]]
          [[ "$package_line" == *"versionCode='$expected_code'"* ]]
          [[ "$package_line" == *"versionName='$expected_name'"* ]]
          "$tools_dir/zipalign" -c -P 16 -v 4 "$apk" >/dev/null
          signer="$("$tools_dir/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          [[ "$signer" == "54d56c9b9eef84ea188efc5853bf9306d0c2ea2a8765a0dcacaf559476c8eccf" ]]
        done

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: konnekt-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk
